name: CI

on:
  push:
  # 显式声明类型：deploy 需要 merge_commit_sha，closed 事件必须包含在内。
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  # Provenance generation in GitHub Actions requires "write" access to the "id-token"
  id-token: write
  contents: read

env:
  CI: true
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  # Corepack 首次下载 yarn 时会交互式询问，CI 里必须关掉
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 2
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Enable Corepack
      run: |
        corepack enable
        corepack --version
        yarn --version
    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
    # commit message 含 skip-cache 时让缓存 key 带随机后缀，等于强制不命中。
    # 用 env 中转而不是把 commit message 直接拼进 shell，避免命令注入。
    - name: Compute cache key suffix
      id: cache-key
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        RUN_ID: ${{ github.run_id }}
      run: |
        if printf '%s' "$COMMIT_MSG" | grep -q 'skip-cache'; then
          echo "suffix=skip-$RUN_ID" >> "$GITHUB_OUTPUT"
        else
          echo "suffix=" >> "$GITHUB_OUTPUT"
        fi
    # 依赖缓存：只跟 yarn.lock 绑定，依赖没变就复用，装包时不走网络
    - name: Restore yarn cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
        key: yarn-${{ runner.os }}-${{ steps.cache-key.outputs.suffix }}${{ hashFiles('yarn.lock') }}
        restore-keys: |
          yarn-${{ runner.os }}-
    # 构建缓存：.cache 里是 tsc 增量产物 + webpack 持久化缓存。
    # 用源码哈希做 key、用"仅含 lock 哈希"的前缀做 restore-keys：
    # 源码一改 key 就变，但仍能回退到最近一次构建结果做增量。
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: .cache
        key: build-${{ runner.os }}-${{ steps.cache-key.outputs.suffix }}${{ hashFiles('yarn.lock') }}-${{ hashFiles('packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.vue', 'framework/**/*.ts') }}
        restore-keys: |
          build-${{ runner.os }}-${{ steps.cache-key.outputs.suffix }}${{ hashFiles('yarn.lock') }}-
          build-${{ runner.os }}-
    - name: Config And Install
      run: |
        git config --global user.name undefined
        git config --global user.email i@undefined.moe
        corepack install
        yarn --version
        yarn
        yarn dedupe
        node build/prepare.js
      env:
        LICENSE_KEY: ${{ secrets.MAXMIND_KEY }}
    - name: Get specific changed files
      id: ui-changed-files
      uses: tj-actions/changed-files@v41
      with:
        files: |
          /package.json
          .eslint*
          packages/ui-default/**
          packages/utils/**
          .github/workflows/**
    - name: Build And Lint
      run: |
        yarn build:ui:iconfont # icon font file needed for types
        if [[ ${{ steps.ui-changed-files.outputs.any_changed }} == true ]] || [[ $(npm info @hydrooj/ui-default version) != $(node -e 'console.log(require("./packages/ui-default/package.json").version)') ]]
        then
          parallel --tty -j+0 yarn ::: lint:ci build build:ui:production:webpack test
        else
          parallel --tty -j+0 yarn ::: lint:ci build test
        fi
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    - name: Publish
      if: ${{ github.event_name == 'push' && github.repository == 'hydro-dev/Hydro' }}
      run: node -r @hydrooj/register build/publish.ts

  # 合并进 master 后自动部署。build job 与 deploy job 是两个独立的 runner，
  # 因此这里重新编译一次制品再上传；只在合并那一刻跑，成本可接受。
  deploy:
    needs: build
    if: >-
      github.repository == 'HGNU/HGNUOJ' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: hgnuoj-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      # 私钥口令。目标机只允许密钥登录，没有登录密码。
      DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_NODE_BIN: ${{ secrets.DEPLOY_NODE_BIN }}
      DEPLOY_ADDON_PATH: ${{ secrets.DEPLOY_ADDON_PATH }}
      DEPLOY_LANGUAGE_SERVER_PATH: ${{ secrets.DEPLOY_LANGUAGE_SERVER_PATH }}
      DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
      DEPLOY_JUDGE_PM2_NAME: ${{ secrets.DEPLOY_JUDGE_PM2_NAME }}
      DEPLOY_JUDGE_CONFIG: ${{ secrets.DEPLOY_JUDGE_CONFIG }}
      DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
      YARN_VERSION: '4.18.1'
    steps:
    - name: Check out the merged commit
      uses: actions/checkout@v4
      with:
        # closed 事件默认检出 refs/pull/N/merge，这里显式指定合并提交。
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        submodules: recursive
        persist-credentials: false
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Set up Yarn
      run: |
        corepack enable
        corepack prepare "yarn@$YARN_VERSION" --activate
        yarn --version
    - name: Locate Yarn cache
      id: yarn-cache
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
    - name: Restore dependency cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: yarn-${{ runner.os }}-${{ env.YARN_VERSION }}-${{ hashFiles('yarn.lock', '**/package.json', '.yarnrc.yml') }}
        restore-keys: |
          yarn-${{ runner.os }}-${{ env.YARN_VERSION }}-
    # sshpass 仅作为口令路径的备用方案，askpass 不需要额外依赖。
    - name: Install sshpass
      run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
    # 服务器只需要装依赖 + 重启，编译全部在这里完成。
    - name: Install dependencies
      run: |
        printf 'enableScripts: false\n' > .yarnrc.deploy.yml
        YARN_RC_FILENAME=.yarnrc.deploy.yml yarn install
      env:
        LICENSE_KEY: ${{ secrets.MAXMIND_KEY }}
    - name: Compile artifacts for the target host
      run: |
        yarn build:ui:iconfont
        yarn build
        yarn build:ui:production:webpack
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    - name: Deploy merged commit over SSH
      shell: bash
      env:
        DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      run: bash .github/deploy/ssh.sh
